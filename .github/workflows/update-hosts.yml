name: Update Cloudflare KV Hosts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate hosts
        run: python update_github_hosts.py

      - name: Upload to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/github_hosts" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" \
          -H "Content-Type: text/plain" \
          --data-binary @github_hosts.txt
