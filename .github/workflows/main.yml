name: Update Cloudflare KV Hosts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'  # 每3天

# 赋予 Actions 写入仓库的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. 运行脚本（脚本内用 "w" 模式会覆盖清空并生成新文件）
      - name: Generate hosts
        run: python update_github_hosts.py

      # 2. 上传到 Cloudflare KV
      - name: Upload to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${KV_NAMESPACE_ID}/values/github_hosts" \
          -H "Authorization: Bearer ${CF_API_TOKEN}" \
          -H "Content-Type: text/plain" \
          --data-binary @github_hosts.txt

      # 3. 将更新后的文件推回 GitHub 仓库，让仓库显示最新时间
      - name: Commit and Push to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # 检查文件是否有变动（如果在 Python 中加了时间戳，每次都会认为有变动）
          if [ -n "$(git status --porcelain github_hosts.txt)" ]; then
            git add github_hosts.txt
            git commit -m "chore: auto update github_hosts.txt ($(date +'%Y-%m-%d %H:%M:%S'))"
            git push
          else
            echo "No changes detected in github_hosts.txt"
          fi
