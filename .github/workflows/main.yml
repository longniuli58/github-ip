name: Update GitHub Hosts

on:

  workflow_dispatch:

  schedule:
    - cron: '0 0 */3 * *'

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Script
        run: |
          python update_github_hosts.py

      - name: Commit Changes
        run: |

          git config --global user.name "github-actions[bot]"

          git config --global user.email \
          "41898282+github-actions[bot]@users.noreply.github.com"

          git add github_hosts.txt

          git diff --cached --quiet || \
          git commit -m "Auto Update Hosts"

          git push
